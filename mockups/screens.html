<style>

.input{background:#fff;border:2px solid #d8cfbd;border-radius:12px;padding:12px 16px;font-size:18px;min-width:260px;text-align:left;color:#9a8f7c;margin:4px}
.codeboxes{display:flex;gap:8px;justify-content:center;margin:6px 0}

.row{display:flex;gap:18px;align-items:center;justify-content:center}
.bar{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;margin-bottom:8px;gap:8px}
.pill{background:#fff;border-radius:99px;padding:5px 12px;box-shadow:0 1px 3px rgba(0,0,0,.15);white-space:nowrap}
.banner{flex:1;text-align:center;border-radius:99px;padding:6px 12px;color:#fff;font-size:16px}
.banner.me{background:var(--green)}.banner.wait{background:#8a8173}.banner.guess{background:var(--red)}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;flex:1;min-height:0}
.card{position:relative;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);display:flex;flex-direction:column;min-height:0}
.card .img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9.5px;line-height:1.25;color:#fff;font-weight:700;padding:3px;position:relative;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .nm{text-align:center;font-weight:900;font-size:12px;padding:2px 0 3px}
.card.down .img,.card.down .nm{filter:grayscale(1) brightness(.5)}
.card.down::after{content:"\2716";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.card.sel{outline:4px solid var(--gold);outline-offset:-4px;transform:scale(1.04);z-index:2;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.card.cand{outline:4px solid var(--red);outline-offset:-4px;z-index:2}
.foot{display:flex;align-items:center;gap:10px;margin-top:8px}
.secret{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:4px 10px 4px 4px;font-weight:800;font-size:13px;border:3px solid var(--gold)}
.secret .thumb{width:46px;height:46px;border-radius:8px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff}
.spacer{flex:1}
.dim{position:absolute;inset:0;background:rgba(20,12,6,.55);display:flex;align-items:center;justify-content:center}
.sheet{background:#fff;border-radius:20px;padding:22px 30px;text-align:center;max-width:430px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.sheet h3{margin:0 0 6px;font-size:24px}.sheet p{margin:0 0 14px;color:var(--muted)}
.big-card{width:200px;height:240px;margin:0 auto 12px}
.confetti{position:absolute;inset:0;pointer-events:none;font-size:30px;overflow:hidden}
.notes{font-size:13px;color:var(--muted);margin:8px 4px 0;line-height:1.5}

 <div class="foot"><div class="secret"><div class="thumb" style="background:${COL[SECRET.coat]}">${SECRET.name}</div>You picked ${SECRET.name}</div><div class="spacer"></div><span class="btn big">Lock it in</span></div>`},
 'Tap a ferret to select (gold ring), then Lock it in. After locking, a player waits until the other does the same, and then the game starts.');
h+=frame('4 · Your turn','main game screen',{h:`
 <div class="bar"><span class="pill">Room FURB</span><span class="banner me">Your turn, Alex! Ask Sam a question aloud.</span><span class="pill">18 ferrets left</span></div>
 ${board({down})}
 <div class="foot"><div class="secret"><div class="thumb" style="background:${COL[SECRET.coat]}">${SECRET.name}</div>Your ferret: ${SECRET.name}</div><div class="spacer"></div><span class="btn red">Guess!</span><span class="btn">End turn</span></div>`},
 'Tap a card to flip it down; tap again to undo. The banner turns gray ("Sam is asking…") on the other player\'s turn, and the board still flips but Guess and End turn are disabled. Tap the secret-ferret chip to peek at it larger.');
h+=frame('5 · Final guess','after tapping Guess!',{h:`
 <div class="bar"><span class="pill">Room FURB</span><span class="banner guess">Tap the ferret you think Sam picked</span><span class="pill">18 ferrets left</span></div>
 ${board({down,cand:20})}
 <div class="dim"><div class="sheet"><div class="card big-card">${img(GUESS)}<div class="nm">${GUESS.name}</div></div><h3>Is it ${GUESS.name}?</h3><p>You only get one guess. A wrong guess loses!</p><span class="btn red">Yes, guess ${GUESS.name}</span><span class="btn alt">Not yet</span></div></div>`},
 'Only ferrets still face-up can be tapped. A confirm sheet appears so a stray tap cannot lose the game.');
h+=frame('6 · Result','win shown; loss uses "Sam guessed your ferret!"',{c:'center',h:`
 <div class="confetti">🎉 &nbsp;&nbsp; ⭐ &nbsp;&nbsp;&nbsp;&nbsp; 🎉 &nbsp;&nbsp;&nbsp;&nbsp; ⭐ &nbsp;&nbsp; 🎉</div>
 <p class="title" style="color:var(--green)">You win!</p><p class="sub">Sam's secret ferret was ${GUESS.name}</p>
 <div class="card big-card" style="margin-bottom:14px">${img(GUESS)}<div class="nm">${GUESS.name}</div></div>
 <div><span class="btn big">Play again</span><span class="btn alt">Leave</span></div><p class="sub" style="margin:8px 0 0">Alex 1 &ndash; 0 Sam</p>`},
 'Play again returns both players to the "Pick your secret ferret" screen (same room, running score). Win sound plays; loss shows "Sam guessed your ferret!" with the lose sound.');
document.getElementById('s').innerHTML=h;
</script></body></html>
